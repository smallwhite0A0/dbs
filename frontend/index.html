<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票交易平台</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ticker-wrap">
        <div class="ticker">
            <span class="ticker-item"><span class="ticker-up">▲ 台積電 (2330) 600.0 (+1.2%)</span></span>
            <span class="ticker-item"><span class="ticker-down">▼ 聯發科 (2454) 900.0 (-0.5%)</span></span>
            <span class="ticker-item"><span class="ticker-up">▲ 鴻海 (2317) 150.5 (+2.1%)</span></span>
            <span class="ticker-item"><span class="ticker-up">▲ 富邦金 (2881) 75.2 (+0.8%)</span></span>
            <span class="ticker-item">※ 系統公告：期末專案大成功！台股交易系統連線正常 ※</span>
        </div>
    </div>

    <div class="container">

        <div id="auth-section" class="section">
            <div class="auth-tabs">
                <button id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">會員登入</button>
                <button id="tab-register" class="auth-tab" onclick="switchAuthTab('register')">新用戶註冊</button>
            </div>
            
            <div id="auth-form">
                <div id="name-field" class="form-group hidden">
                    <label>真實姓名</label>
                    <input type="text" id="user-name" placeholder="請輸入您的姓名">
                </div>
                
                <div class="form-group">
                    <label>電子信箱 (Email)</label>
                    <input type="email" id="user-email" placeholder="example@email.com">
                </div>
                
                <div class="form-group">
                    <label>帳號密碼</label>
                    <input type="password" id="user-password" placeholder="請輸入密碼">
                </div>
                
                <br>
                <button id="btn-auth-submit" onclick="handleAuthSubmit()">立即登入</button>
            </div>
        </div>

 <div id="dashboard-section" class="section hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 style="margin-bottom: 0;">交易大廳</h2>
                <button id="btn-logout" onclick="logout()">登出帳號</button>
            </div>
            <p>歡迎，<span id="display-name" style="font-weight: bold; color: #2563eb;"></span>！ | 目前可用資金：<span id="display-balance" style="font-weight: bold; color: #10b981;"></span> 元</p>

            <div class="main-tabs">
                <button id="nav-market" class="main-tab active" onclick="switchMainTab('market')">大盤權值股</button>
                <button id="nav-inventory" class="main-tab" onclick="switchMainTab('inventory')">我的庫存 (未實現損益)</button>
                <button id="nav-realized" class="main-tab" onclick="switchMainTab('realized')">已實現損益 (歷史結算)</button>
                <button id="nav-order" class="main-tab" onclick="switchMainTab('order')">下單</button>
                <button id="nav-history" class="main-tab" onclick="switchMainTab('history')">歷史成交明細</button>
            </div>

           <div id="content-market" class="tab-content">
    
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin-top: 10px;">加權指數：<span id="taiex-index" style="color: #ef4444;">---</span></h3>
        <button onclick="openAllStocksModal()" style="padding: 6px 12px; font-size: 0.85rem; background-color: #475569; color: white; border-radius: 4px; border: none; cursor: pointer;">詳細報價</button>
    </div>

    <table id="stock-table">
        <thead>
            <tr>
                <th>代號</th>
                <th>名稱</th>
                <th>目前股價</th>
            </tr>
        </thead>
        <tbody id="stock-list"></tbody>
    </table>

</div>

            <div id="content-inventory" class="tab-content hidden">
                <table id="inventory-table">
                    <thead>
                        <tr><th>股票 (代號)</th><th>庫存數量</th><th>平均成本</th><th>最新現價</th><th>未實現損益</th><th>報酬率 (%)</th></tr>
                    </thead>
                    <tbody id="inventory-list"></tbody>
                </table>
            </div>

            <div id="content-realized" class="tab-content hidden">
                <table id="realized-table">
                    <thead>
                        <tr><th>股票 (代號)</th><th>買入均價</th><th>賣出均價</th><th>已實現損益</th><th>獲利率 (%)</th></tr>
                    </thead>
                    <tbody id="realized-list"></tbody>
                </table>
            </div>

            <div id="content-order" class="tab-content hidden">
                <div class="trading-terminal">
                    
                    <div class="terminal-row">
                        <label>商品代號</label>
                        <input type="text" id="order-stock-id" placeholder="輸入代號 (例: 2330)" onkeyup="searchStock()">
                        <span id="order-stock-name" class="stock-info-badge">---</span>
                    </div>

                    <div class="terminal-row">
                        <label>目前市價</label>
                        <span id="order-stock-price" class="price-display">---</span>
                    </div>

                    <div class="terminal-row">
                        <label>買賣方向</label>
                        <div class="order-type-toggle">
                            <button id="btn-type-buy" class="type-btn active" onclick="setOrderType('buy')">買進</button>
                            <button id="btn-type-sell" class="type-btn" onclick="setOrderType('sell')">賣出</button>
                        </div>
                    </div>

                    <div class="terminal-row">
                        <label>委託數量</label>
                        <input type="number" id="order-quantity" placeholder="輸入股數" onkeyup="calculateTotal()" onchange="calculateTotal()">
                    </div>

                    <div class="terminal-divider"></div>

                    <div class="terminal-row total-row">
                        <label>試算預估</label>
                        <div><span id="order-total-price">0</span> 元</div>
                    </div>

                    <button id="btn-submit-order" class="submit-order-btn buy-mode" onclick="submitSmartOrder()">確認買進</button>
                
                </div>
            </div>

            <div id="content-history" class="tab-content hidden">
                <div style="text-align: right; margin-bottom: 10px;">
                    <button onclick="getHistory()" style="padding: 6px 12px; font-size: 0.85rem; background-color: #64748b; color: white;">刷新紀錄</button>
                </div>
                <table>
                    <thead>
                        <tr><th>訂單編號</th><th>股票代號</th><th>動作</th><th>成交價</th><th>數量</th><th>時間</th></tr>
                    </thead>
                    <tbody id="history-list"></tbody>
                </table>
            </div>
            
        </div>

    <script src="app.js"></script>

<div id="all-stocks-modal" class="hidden" style="position: fixed; top: 10%; left: 50%; transform: translateX(-50%); width: 80%; max-width: 600px; max-height: 80vh; background: white; border-radius: 8px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">
            <h2 style="margin: 0;">全部股票詳細報價</h2>
            <button onclick="closeAllStocksModal()" style="background: #ef4444; color: white; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer;">關閉 (X)</button>
        </div>
        <table style="width: 100%;">
            <thead>
                <tr>
                    <th>股票代號</th>
                    <th>股票名稱</th>
                    <th>最新現價</th>
                </tr>
            </thead>
            <tbody id="all-stock-list"></tbody>
        </table>
    </div>
    
</body>
</html>
